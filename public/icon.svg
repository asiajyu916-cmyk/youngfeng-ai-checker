<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 深藍漸層背景 (145deg ≈ top-left → bottom-right) -->
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#1B3A8A"/>
      <stop offset="55%"  stop-color="#0E2259"/>
      <stop offset="100%" stop-color="#070F2B"/>
    </linearGradient>
    <!-- 金色底線（中間實色，兩端淡出）-->
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D6A85A" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#D6A85A"/>
      <stop offset="80%"  stop-color="#D6A85A"/>
      <stop offset="100%" stop-color="#D6A85A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景：全出血，無 rx，讓平台決定遮罩 -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- YF 文字：Georgia 900，居中，緊排 -->
  <text
    x="256" y="338"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="295"
    font-weight="900"
    letter-spacing="-12"
    fill="white"
  >YF</text>

  <!-- 金色底線 -->
  <rect x="133" y="369" width="246" height="31" rx="15" fill="url(#bar)"/>
</svg>
